name: Generate Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create download folder
        run: mkdir -p dist

      - name: Download Stats Image
        run: |
          curl -s "https://mes-stats-github-zeta.vercel.app/api?username=uyhnez&show_icons=true&hide_border=true&hide_rank=true&custom_title=Pierre&count_private=true&include_all_commits=true&theme=github_dark" -o dist/stats.svg

      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
